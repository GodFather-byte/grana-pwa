<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grana</title>
<meta name="description" content="Controle de gastos por voz: fale o que gastou e acompanhe orçamentos, metas e relatórios.">
<meta name="theme-color" content="#0F5C66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grana">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="view" tabindex="-1"></main>

  <div id="rec" hidden>
    <span class="rec-dot" aria-hidden="true"></span>
    <span id="rec-label">Ouvindo</span>
    <span id="rec-time">0:00</span>
    <button class="btn ghost sm" data-a="recCancel">Cancelar</button>
  </div>

  <nav id="nav" aria-label="Seções">
    <button data-a="go" data-v="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></button>
    <button data-a="go" data-v="lancamentos"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>Lançamentos</span></button>
    <button id="fab" data-a="mic" aria-label="Falar com o assistente">
      <span class="fab-ring" aria-hidden="true"></span>
      <svg class="i-mic" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <svg class="i-stop" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>
    </button>
    <button data-a="go" data-v="planejar"><svg viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg><span>Planejar</span></button>
    <button data-a="go" data-v="relatorios"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Relatórios</span></button>
  </nav>
</div>

<div id="sheet" hidden>
  <div class="sheet-bg" data-a="closeSheet"></div>
  <div class="sheet-box" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="pick-foto" accept="image/*" capture="environment" hidden>
<input type="file" id="pick-backup" accept="application/json,.json" hidden>

<script src="js/app.js"></script>
</body>
</html>
